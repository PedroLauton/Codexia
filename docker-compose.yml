services:
  postgres:
    image: postgres:16
    container_name: codexia-db
    environment:
      POSTGRES_DB: codexia
      POSTGRES_USER: codexia
      POSTGRES_PASSWORD: codexia
    ports:
      - "5432:5432"
    volumes:
      - codexia_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "wal_level=logical"]

  postgres-test:
    image: postgres:16
    container_name: codexia-db-test
    environment:
      POSTGRES_DB: codexia_test
      POSTGRES_USER: codexia
      POSTGRES_PASSWORD: codexia
    ports:
      - "5433:5432"
    volumes:
      - codexia_test_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: codexia-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: codexia-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-connect:
    image: debezium/connect:2.6
    container_name: codexia-connect
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: codexia-connect-group
      CONFIG_STORAGE_TOPIC: codexia-connect-configs
      OFFSET_STORAGE_TOPIC: codexia-connect-offsets
      STATUS_STORAGE_TOPIC: codexia-connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

volumes:
  codexia_data:
  codexia_test_data: